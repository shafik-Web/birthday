<!DOCTYPE html>
<html>

<head>
    <style type="text/css">
        @font-face {
            src: url('https://neonichesolutions.co.in/onsite/storage/GTHaptik-Regular.ttf') format('truetype');
            font-family: 'GT Haptik';
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>

<body style="margin: 0; padding: 0;">
    <div class="badge-container"
        style="width: 105mm; height: 152mm; position: relative; box-sizing: border-box; font-family: 'GT Haptik', Segoe, Verdana, sans-serif; text-align: center; margin: 0 auto; overflow: hidden;">

        <div class="badge-body"
            style="position: absolute; top: 38mm; left: 0; right: 0; bottom: 24mm; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 0 10px;">
            <div class="fname"
                style="font-size: [fname_fontsize]; font-weight: bold; color: #051a37; line-height: 1.1; margin-bottom: 2px;">
                [name]</div>
            <div class="lname"
                style="font-size: [lname_fontsize]; color: #051a37; line-height: 1.2; margin-bottom: 12px;">[lname]
            </div>
            <div class="designation" style="font-size: 16px; color: #051a37; line-height: 1.2; margin-bottom: 10px;">
                [designation]</div>
            <div class="company-main" style="font-size: 20px; font-weight: bold; color: #051a37; line-height: 1.2;">
                [company]</div>
        </div>

        <div class="qr-container" style="position: absolute; right: 12mm; bottom: 26mm;">
            <img id="badgeqrcode" src="https://www.neonichesolutions.co.in/onsite/public/assets/images/dummyqr.png"
                alt="QR Code" style="width: 65px; height: 65px; display: block;" />
        </div>

        <div class="footer-section" style="position: absolute; bottom: 0; left: 0; width: 100%;">
            <div class="category-strip"
                style="background-color: #a6a6a6; color: #ffffff; font-size: 22px; font-weight: normal; text-align: center; padding: 6px 0; line-height: 1;">
                [category]</div>
            <div class="company-strip"
                style="background-color: #000000; color: #ffffff; font-size: 22px; font-weight: bold; text-align: center; padding: 8px 0; line-height: 1;">
                [company]</div>
        </div>

    </div>
</body>

</html>
